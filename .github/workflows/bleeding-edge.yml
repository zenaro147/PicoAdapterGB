name: PicoAdapterGB Bleeding Edge

on:
  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  pico_w_reon:
    name: Pico W - REON
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout PicoAdapterGB
        uses: actions/checkout@v4
        with:
          ref: develop
          submodules: recursive
          fetch-depth: 1

      - name: Checkout Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.0
          path: pico-sdk
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DPICO_SDK_PATH="${GITHUB_WORKSPACE}/pico-sdk" \
            -DPICO_BOARD=pico_w \
            -DADAPTER=REON \
            -DPICO_ADAPTER_SOFTWARE="bleeding-edge (${GITHUB_SHA})" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --target PicoAdapterGB_PicoW --parallel

      - name: Verify
        run: |
          test -f build/release/REON/PicoW/PicoAdapterGB_PicoW.uf2

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp build/release/REON/PicoW/PicoAdapterGB_PicoW.uf2 artifact/PicoAdapterGB-REON-PicoW.uf2

          printf '%s\n' \
            'PicoAdapterGB Bleeding Edge' \
            '' \
            "Branch: develop" \
            "Commit: ${GITHUB_SHA}" \
            "Adapter: REON" \
            "Board: pico_w" \
            "Pico SDK: 2.3.0" \
            > artifact/build-info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicoAdapterGB-bleeding-edge-PicoW-REON
          path: artifact
          retention-days: 14

  pico_w_stacksmashing:
    name: Pico W - STACKSMASHING
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout PicoAdapterGB
        uses: actions/checkout@v4
        with:
