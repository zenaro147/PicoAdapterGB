      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicoAdapterGB-bleeding-edge-PicoW-STACKSMASHING
          path: artifact
          retention-days: 14

  pico2_w_reon:
    name: Pico 2 W - REON
