      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DPICO_SDK_PATH="${GITHUB_WORKSPACE}/pico-sdk" \
            -DPICO_BOARD=pico_w \
            -DADAPTER=STACKSMASHING \
            -DPICO_ADAPTER_SOFTWARE="bleeding-edge (${GITHUB_SHA})" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --target PicoAdapterGB_PicoW_SmBoard --parallel

      - name: Verify
        run: |
          test -f build/release/SmBoard/PicoW/PicoAdapterGB_PicoW_SmBoard.uf2

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp build/release/SmBoard/PicoW/PicoAdapterGB_PicoW_SmBoard.uf2 artifact/PicoAdapterGB-STACKSMASHING-PicoW.uf2

          printf '%s\n' \
            'PicoAdapterGB Bleeding Edge' \
