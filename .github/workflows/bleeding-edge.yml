          cp build/release/SmBoard/Pico2W/PicoAdapterGB_Pico2W_SmBoard.uf2 artifact/PicoAdapterGB-STACKSMASHING-Pico2W.uf2

          printf '%s\n' \
            'PicoAdapterGB Bleeding Edge' \
            '' \
            "Branch: develop" \
            "Commit: ${GITHUB_SHA}" \
            "Adapter: STACKSMASHING" \
            "Board: pico2_w" \
            "Pico SDK: 2.3.0" \
            > artifact/build-info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicoAdapterGB-bleeding-edge-Pico2W-STACKSMASHING
          path: artifact
          retention-days: 14
  
  publish_bleeding_edge:
    name: Publish Bleeding Edge Release
    runs-on: ubuntu-22.04

    needs:
      - pico_w_reon
      - pico_w_stacksmashing
      - pico2_w_reon
      - pico2_w_stacksmashing

    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout PicoAdapterGB
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release

          cp artifacts/PicoAdapterGB-bleeding-edge-PicoW-REON/PicoAdapterGB-REON-PicoW.uf2 \
            release/PicoAdapterGB-REON-PicoW.uf2

          cp artifacts/PicoAdapterGB-bleeding-edge-PicoW-STACKSMASHING/PicoAdapterGB-STACKSMASHING-PicoW.uf2 \
            release/PicoAdapterGB-STACKSMASHING-PicoW.uf2

          cp artifacts/PicoAdapterGB-bleeding-edge-Pico2W-REON/PicoAdapterGB-REON-Pico2W.uf2 \
            release/PicoAdapterGB-REON-Pico2W.uf2

          cp artifacts/PicoAdapterGB-bleeding-edge-Pico2W-STACKSMASHING/PicoAdapterGB-STACKSMASHING-Pico2W.uf2 \
            release/PicoAdapterGB-STACKSMASHING-Pico2W.uf2

          ls -lh release

      - name: Create Bleeding Edge release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_notes="Automated bleeding-edge build from develop.

          Commit: ${GITHUB_SHA}

          Included builds:
          - Pico W / REON
          - Pico W / STACKSMASHING
          - Pico 2 W / REON
          - Pico 2 W / STACKSMASHING"

          if gh release view bleeding-edge >/dev/null 2>&1; then
            echo "Bleeding Edge release exists. Updating assets and notes..."

            gh release view bleeding-edge --json assets --jq '.assets[].name' | while read -r asset_name; do
              [ -n "${asset_name}" ] || continue
              gh release delete-asset bleeding-edge "${asset_name}" --yes
            done

            gh release upload bleeding-edge release/*.uf2
            gh release edit bleeding-edge \
              --title "PicoAdapterGB Bleeding Edge" \
              --draft=false \
              --prerelease \
              --notes "${release_notes}"

            echo "Bleeding Edge release updated successfully."
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            echo "Creating Bleeding Edge release (attempt $attempt/5)..."

            if gh release create bleeding-edge \
              --target develop \
              --title "PicoAdapterGB Bleeding Edge" \
              --prerelease \
              --notes "${release_notes}" \
              release/*.uf2; then
              echo "Bleeding Edge release created successfully."
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "GitHub API failed. Waiting 15 seconds before retry..."
              sleep 15
            fi
          done

          echo "Failed to create Bleeding Edge release after 5 attempts."
          exit 1